ers and lenders on the financing of USS's acquisition of VTG Rail UK", "title_ja": "VTG Rail UK買収、USSが買収ファイナンスを組成", "source": "Legal Desire", "url": "https://legaldesire.com/linklaters-advises-underwriters-and-lenders-on-the-financing-of-usss-acquisition-of-vtg-rail-uk/", "published_at": "2026-10-02", "summary_ja": ["英年金基金 USS による VTG Rail UK の全株式取得について、買収ファイナンスの引受金融機関および貸し手側に Linklaters が助言したと伝えられた。", "案件は同法律事務所の Energy & Infrastructure 部門グローバル責任者 Richard Ginks と Subir Rajadhyaksha パートナーが率いるチームが担当したとされる。", "VTG Rail UK は英国の貨物鉄道向けに約4,500両の車両を貸し出すリース事業で、売買契約は規制当局の承認を要さず2026年第4四半期のクロージングが見込まれている。"], "collected_at": "2026-10-02T06:27:04-07:00"}, {"category": "container_leasing", "kind": "regulatory", "title": "CMA CGM fires back at Samsung’s $186m FMC claim", "title_ja": "CMA CGM、Samsungの1.86億ドルFMC申立てに反論", "source": "Seatrade Maritime", "url": "https://www.seatrade-maritime.com/containers/cma-cgm-fires-back-at-samsung-s-186m-fmc-claim", "published_at": "2026-10-02", "summary_ja": ["CMA CGM は今週、米FMCに宣誓回答書を提出し、Samsung Electronics による1億8,600万ドルの申立ての却下を求めた。", "Samsungの請求は不当とする滞留料・ディテンション・鉄道保管料など1億4,800万ドルを軸に、代替輸送などの費用810万ドルと判決前利息3,000万ドル以上で構成され、対象は12万1,000件を超える課金に及ぶ。", "CMA CGMは申立てを「見当違いのキャンペーン」と批判し、Samsungがコロナ期に収益を大きく伸ばす一方で輸入急増への備えを欠いていたと主張。初審判断は2027年9月1日、最終決定は2028年3月15日が見込まれる。"], "collected_at": "2026-10-02T13:28:54-07:00"}, {"category": "container_leasing", "kind": "news", "title": "New material cuts shipping container temperatures by up to 22°C", "title_ja": "無電源の放射冷却フィルム、コンテナ温度を最大22℃低減", "source": "WorldCargo News", "url": "https://www.worldcargonews.com/news/2026/10/new-material-cuts-shipping-container-temperatures-by-up-to-22c/", "published_at": "2026-10-02", "summary_ja": ["スペインのスタートアップ Cooling Photonics の放射冷却フィルム「CoolPly」が、バレンシア港のサンドボックス実証でコンテナ内温度を最大22℃引き下げた。", "実証は Transbase Soler のデポで夏季15日間、日射条件を揃えた20フィートコンテナ4本（無処理・内側断熱ブランケット・屋根のみ塗布・屋根と側壁に塗布）を比較する形で行われた。", "無処理は53℃に達し試験期間の3分の1超で40℃を上回った一方、全面塗布は34.2℃以下に収まり日最高温度の低減幅は平均17.5℃。電力を使わず機材の熱負荷を抑える手法として、ドライコンテナの保管・輸送にも応用余 ate-data-maps-where-saskatchewan-potash-goes-by-rail/", "published_at": "2026-09-25", "summary_ja": ["線路脇モニタリング会社RailStateのデータが、CPKCとCNで運ばれるサスカチュワン産カリ肥料の行き先を路線別に示した。", "同州で採掘されるカリ肥料はほぼ全量が鉄道で州外に運ばれるため、ホッパー車の需給と輸送ルートの把握に直結する。", "トランプ大統領が9月21日にベラルーシからのカリ肥料調達交渉に言及するなど貿易摩擦で政治問題化しており、荷主や投資家の関心が高まっている。"], "collected_at": "2026-09-26T06:27:48-07:00"}, {"category": "rail_industry", "kind": "regulatory", "title": "Rail Industry Wants Full 11th Circ. To Review FRA Rule", "title_ja": "鉄道業界、2人乗務規則で第11巡回区の大法廷審理を請求", "source": "Law360", "url": "https://www.law360.com/articles/2529902/rail-industry-wants-full-11th-circ-to-review-fra-rule", "published_at": "2026-09-25", "summary_ja": ["AAR、ASLRRAと鉄道6社が、FRAの2人乗務義務規則を支持した第11巡回区控訴裁の判断について大法廷（en banc）での再審理を求めた。", "3人合議体は93ページ・2対1の判断で「鉄道側の主張にはいずれも理由がない」として訴えを退けていた。", "申立ては同判断が行政機関の権限を不当に広げ最高裁判例に反すると主張しており、乗務員規制は貨物列車の運行コストと自動化計画に影響する。"], "collected_at": "2026-09-26T06:27:48-07:00"}, {"category": "container_leasing", "kind": "news", "title": "Drewry: World Container Index Down 1% Last Week", "title_ja": "Drewry世界コンテナ指数、1%下落し4,468ドル", "source": "Hellenic Shipping News", "url": "https://www.hellenicshippingnews.com/drewry-world-container-index-down-1-last-week-11/", "published_at": "2026-09-25", "summary_ja": ["9月24日時点のDrewry世界コンテナ指数（WCI）は40フィートコンテナ当たり4,468ドルで、前週から1%下落した。", "下げはアジア→欧州航路の運賃低下が主因で、上海→ロサンゼルスは2%上昇の7,838ドル、上海→ニューヨークは10,373ドルで横ばいだった。", "船社は抜港（ブランクセーリング）で供給を調整しており、翌週は15便の抜港が告知されている。"], "collected_at": "2026-09-26T06:27:48-07:00"}, {"category": "eu_railcar_leasing", "kind": "news", "title": "FS Logistix is entering the demonstration phase of the DAC system", "title_ja": "FS Logistix、DACを実運用環境での実証段階へ", "source": "Railway PRO", "url": "https://www.railwaypro.com/wp/fs-logistix-is-entering-the-demonstration-phase-of-the-dac-system/", "published_at": "2026-09-25", "summary_ja": ["イタリアFS傘下のFS Logistixが、InnoTrans 2026でデジタル自動連結器（DAC）を試験段階から実運用環境での実証段階に移すと表明した。", "同社はMercitalia Intermodal、Mercitalia Rail、Mercitalia Shunting & Terminalを通じ、Europe's RailのTRANS4M-RとDACtiVateの両プロジェクトに参加している。", "DACは連結・解放の自動化で作業の安全性を高め列車長と積載量の拡大や作業時間・コストの削減につながるとされ、イタリア初のデモ列車は2026年内の投入が予定されている。"], "collected_at": "2026-09-26T06:27:48-07:00"}, {"category": "eu_railcar_leasing", "kind": "news", "title": "Fuel price crisis: 'Shippers more inclined to shift to rail freight'", "title_ja": "燃料高で荷主の鉄道シフト志向強まる、仏運送会社が転換加速", "source": "RailFreight.com", "url": "https://www.railfreight.com/railfreight/2026/09/25/fuel-price-crisis-shippers-more-inclined-to-shift-to-rail-freight/", "published_at": "2026-09-25", "summary_ja": ["RailFreight.comは、燃料価格の高騰を背景に荷主の間で道路から鉄道貨物へのモーダルシフト志向が強まっていると報じた。", "フランス・バスク地方の運送会社Transports Darrieussecqは、早期に進めたroad-to-railへの切り替えが奏功し取扱いを伸ばしていると説明している。", "ディーゼル価格の高止まりが続けば欧州の貨車・機関車の稼働需要を下支えする要因となり、リース会社には追い風となりうる。"], "collected_at": "2026-09-26T13:27:08-07:00"}, {"category": "alt_investment", "kind": "news", "title": "PIC and USS target more infra debt, eye digital space", "title_ja": "英PICとUSS、インフラデットへの配分拡大を表明", "source": "Infrastructure Investor", "url": "https://www.infrastructureinvestor.com/pic-and-uss-target-more-infra-debt-eye-digital-space/", "published_at": "2026-09-25", "summary_ja": ["Infrastructure Investorの欧州フォーラムで、英保険会社Pension Insurance Corporation（PIC）と大学退職年金USSがインフラデットへの配分を拡大する方針を示した。", "両者はデジタル化と電力インフラが交差する領域に大きな資金投下の機会があるとの見方を示している。", "プライベートウェルス層からのインフラデット需要も高まっており、2026年は同分野への配分が回復傾向にあると報じられている。"], "collected_at": "2026-09-26T13:27:08-07:00"}, {"category": "rail_industry", "kind": "news", "title": "CSX: ‘Speeding Emergency Response, Improving Safety’", "title_ja": "CSX、通報者のライブ映像を共有する緊急対応システムを導入", "source": "Railway Age", "url": "https://www.railwayage.com/freight/csx-speeding-emergency-response-improving-safety/", "published_at": "2026-09-25", "summary_ja": ["CSXは自社のPublic Safety Coordination Center（PSCC）に、緊急通報者がリアルタイムの位置情報と現場のライブ映像を安全に共有できる新技術を導入したと発表した。", "PSCCのオペレーターは通報者の位置を即座に特定したうえで映像共有用の安全なリンクを送信でき、CSXは同種システムを配備した最初の鉄道会社だとしている。", "発表は9月21〜27日のRail Safety Week 2026に合わせたもので、地元の消防・警察との状況把握 category": "rail_industry", "kind": "regulatory", "title": "STB Denies Motions Seeking Summary Denial of UP-NS Merger Application", "title_ja": "STB、UP-NS合併申請の即時却下を求める申立てを棄却", "source": "Surface Transportation Board", "url": "https://www.stb.gov/news-communications/latest-news/pr-26-23/", "published_at": "2026-09-18", "summary_ja": ["STBは9月18日、Union PacificとNorfolk Southernの改訂合併申請を略式却下するよう求めた複数の申立てを退ける決定を公表した。", "申立ては8月6日にBNSF Railway、CSX Transportation、および米国化学工業協会（ACC）・AFPM・NITL・The Fertilizer Instituteなど荷主団体連合の計3件が、申請がprima facie（一応の立証）基準を満たしていないとして提出していた。", "決定は合併の是非を判断したものではなく、各当事者はopening commentsで同じ主張を改めて展開でき、審査手続きはそのまま継続する。"], "collected_at": "2026-09-19T06:27:12-07:00"}, {"category": "rail_industry", "kind": "news", "title": "US railroad CSX announces hundreds of track maintenance worker layoffs", "title_ja": "CSX、線路保守員数百人の一時解雇を通知", "source": "World Socialist Web Site", "url": "https://www.wsws.org/en/articles/2026/09/18/bzsa-s18.html", "published_at": "2026-09-18", "summary_ja": ["保線労組BMWED（チームスターズ保線従業員部門）は9月11日、CSXが保線（MOW）部門で大規模な人員削減に踏み切ると明らかにした。", "内容は165ポジションの恒久的廃止、複数拠点の閉鎖、最大1,062人の一時帰休で、うち約900人はシステムギャング所属のBMWED組合員とされる。", "CSXは7月22日に第2四半期の営業利益15.1億ドル・純利益10.0億ドル（前年同期比それぞれ17%増・21%増）を発表した直後で、システムギャングの再開は2月下旬まで見込まれていない。"], "collected_at": "2026-09-19T06:27:12-07:00"}, {"category": "rail_industry", "kind": "regulatory", "title": "Regulators turn down requests for summary denial of UP-NS merger", "title_ja": "STB、UP-NS合併申請の即時却下を求める申立てを退ける", "source": "FreightWaves", "url": "https://www.freightwaves.com/news/regulators-turn-down-requests-for-summary-denial-of-up-ns-merger", "published_at": "2026-09-18", "summary_ja": ["米STBは9月18日、BNSF、CSXおよび荷主団体連合が8月6日に申し立てたUP-NS合併申請の即時却下（summary denial）3件をいずれも却下した。", "申立て側は申請がprima facie（一応の立証）基準を満たしておらず致命的な欠陥があると主張していた。", "STBは5ページの決定で「重要な論点を含むが、さらなる証拠と主張が判断に資する」として審理継続を選択し、本格審査が続くことになった。"], "collected_at": "2026-09-23T13:26:23-07:00"}, {"category": "rail_industry", "kind": "news", "title": "Union protests as CSX plans to cut or furlough maintenance-of-way workers", "title_ja": "CSX、保線165職の廃止と最大1,062人の一時帰休へ", "source": "Trains", "url": "https://www.trains.com/pro/maintenance-of-way/union-protests-as-csx-plans-to-cut-or-furlough-maintenance-of-way-workers/", "published_at": "2026-09-18", "summary_ja": ["保線労組BMWEDによると、CSXは保線（MOW）職165ポジションの恒久廃止と複数の保線拠点閉鎖、最大1,062人の一時帰休を進める。", "CSXは9月14日に組合へ通知し11月中旬までに実施、線路班の約900人は2月まで復帰見込みがないとされる。", "CSXは季節的な作業量に合わせたEngineering部門の調整と説明する一方、組合は保守の積み残しと安全リスクをFRA・STB・議会に訴える構えで、ある区間では従来12人が担当した本線142マイルと複数ヤードを4人で受け持つ計画という。"], "collected_at": "2026-09-23T13:26:23-07:00"}, {"category": "eu_railcar_leasing", "kind": "news", "title": "Knorr-Bremse wins Europe's 'first commercial DAC equipment order' under pioneer train programme", "title_ja": "Knorr-Bremse、欧州初のDAC商用受注をRail Cargo Groupから獲得", "source": "Railway Gazette International", "url": "https://www.railwaygazette.com/news/2026/09/18/knorr-bremse-wins-europes-first-commercial-dac-equipment-order/", "published_at": "2026-09-18", "summary_ja": ["Rail Cargo Group（RCG）がKnorr-Bremseに、欧州初の商用となるデジタル自動連結器（DAC）機器の契約を発注したと9月17日に発表された。", "対象は貨車23両と機関車1両で編成される列車で、DACに加え電子制御ユニットとセンサーを搭載し車両の機能と状態をデジタル監視する。", "この編成はEUが支援するPioDACプログラムの7本の「パイオニア列車」の1本で、2028年から通常の貨物運用に入り技術の信頼性と経済性を検証する。"], "collected_at": "2026-09-23T13:26:23-07:00"}, {"category": "rail_industry", "kind": "news", "title": "UP-NS Merger Would Create Seven New Premium Intermodal Lanes, Railroads Say", "title_ja": "UP・NS、合併でプレミアム・インターモーダル7路線を新設と主張", "source": "Railway Age", "url": "https://www.railwayage.com/freight/class-i/up-ns-merger-would-create-seven-new-premium-intermodal-lanes-railroads-say/", "published_at": "2026-09-18", "summary_ja": ["Union PacificのJim Vena CEOは、北米インターモーダル協会（IANA）のExpoで、NSとの合併によりプレミアム・インターモーダル7路線を新設し、既存約10,000レーンを単一鉄道サービス化できると述べた。", "両社は統合後に約100港湾とカナダ・メキシコ向け10の国際ゲートウェイにアクセスでき、年間約35億ドルのコスト効果と約210万トラック積みのモーダルシフトが見込めるとしている。", "取引完了時期は2027年第3〜第4四半期を想定しており、リードタイム短縮と定時性向上を荷主への訴求点に据えている。"], "collected_at": "2026-09-28T06:32:48-07:00"}, {"category": "container_leasing", "kind": "news", "title": "Container peak season still ongoing, port congestion hits new high", "title_ja": "コンテナ繁忙期が継続、港湾混雑は過去最高水準", "source": "Seatrade Maritime", "url": "https://www.seatrade-maritime.com/containers/container-peak-season-still-ongoing-port-congestion-hits-new-high", "published_at": "2026-09-17", "summary_ja": ["DHL Global ForwardingのOcean Freight Market Updateによると、アジア発の需要が旺盛でコンテナ市況の逼迫が続いている。", "同レポートはアジア～米州航路でピークシーズンが終わっていないこと、港湾混雑が過去最高水準に達したこと、船社がスエズ運河経由に段階的に復帰していることの3点を指摘した。", "太平洋航路のピークは今年早く到来し例年になく長引いており、年末商戦と10月上旬の中国国慶節（Golden Week）を前にした在庫積み増しが背景で、機器の回転低下はリース需要を下支えする。"], "collected_at": "2026-09-17T06:18:24-07:00"}, {"category": "alt_investment", "kind": "news", "title": "Monroe Capital Leads $60 Million Investment in 36th Street Capital", "title_ja": "Monroe Capital、設備リースの36th Streetに6,000万ドル", "source": "Business Wire", "url": "https://www.businesswire.com/news/home/20260917739964/en/Monroe-Capital-Leads-%2460-Million-Investment-in-36th-Street-Capital", "published_at": "2026-09-17", "summary_ja": ["Monroe Capitalが設備リース・ローン会社36th Street Capital（36SC）向けに6,000万ドルのClass Bタームローンを主導した。", "36SCは米国の大企業・中堅企業に仕組みリースとローンを提供し、製造・テクノロジー・ヘルスケア・建設・食品飲料に分散したポートフォリオで事業必需設備を金融しており、今回の資金は組成拡大とプラットフォーム拡張に充てられる。", "案件はMonroeで設備金融を担当するAaron Levy氏とChris Spanel氏が主導し、オルタナティブ・クレジット部門共同責任者のKyle Asher氏は36SCの仕組み力と市場地位を評価するとコメントした。"], "collected_at": "2026-09-17T06:18:24-07:00"}, {"category": "rail_industry", "kind": "news", "title": "AAR Reports Weekly Rail Traffic for the Week Ending September 12, 2026", "title_ja": "AAR週次輸送量（9月12日終了週）", "source": "Railpace", "url": "https://railpace.com/aar-reports-weekly-rail-traffic-for-the-week-ending-september-12-2026/", "published_at": "2026-09-17", "summary_ja": ["米国鉄道協会（AAR）が9月12日までの週の米国鉄道輸送量を公表し、carloadとインターモーダルの合計は494,865単位で前年同週比3.7%減となった。", "carloadは223,560台で3.3%減、インターモーダルは271,305個で4.1%減、10商品群のうち増加は穀物（+3,461台の23,507台）、石油・石油製品（+663台の10,901台）、林産品（+174台の8,342台）の3つにとどまった。", "自動車・部品（-3,313台）、化学品（-3,195台）、石 7:00"}, {"category": "rail_industry", "kind": "news", "title": "Norfolk Southern: New intermodal era about removing rail friction", "title_ja": "NS幹部、インターモーダルは運賃競争から使い勝手の勝負へ", "source": "FreightWaves", "url": "https://www.freightwaves.com/news/norfolk-southern-new-intermodal-era-about-removing-rail-friction", "published_at": "2026-09-17", "summary_ja": ["NSのShawn Tureman自動車・インターモーダル営業担当VPが、IANA年次総会（Long Beach）で事業の局面転換を説明した。", "今後の成否はトラックとの単純なコスト比較ではなく、予約・計画・追跡・利用のしやすさで決まると指摘した。", "在職23年の同氏は、30年近く続いた「インターモーダルはトラックに対抗できるか」という問い自体がもはや適切でないとの見方を示した。"], "collected_at": "2026-09-24T21:16:18-07:00"}, {"category": "eu_railcar_leasing", "kind": "news", "title": "Stibbe advises European Locomotive Leasing on landmark EUR 1.4 billion refinancing", "title_ja": "European Locomotive Leasing、14億ユーロの借換えを完了", "source": "Stibbe", "url": "https://www.stibbe.com/publications-and-insights/stibbe-advises-european-locomotive-leasing-on-landmark-eur-14-billion", "published_at": "2026-09-16", "summary_ja": ["電気機関車リース大手European Locomotive Leasing（ELL）が約14億ユーロ規模の借換えを完了した。", "ルクセンブルク法人向けに9億500万ユーロの融資枠を設定し、ユーロ建て私募債2億8,500万ユーロと米国私募債2億3,800万ユーロを発行。", "既存債務を英国法準拠の共通条件プラットフォームに移行し、欧米の銀行団と私募投資家を束ねた資金調達となった。"], "collected_at": "2026-09-16T03:12:32-07:00"}, {"category": "eu_railcar_leasing", "kind": "news", "title": "Rail freight transport dropped by 1.8% in 2025", "title_ja": "EUの鉄道貨物輸送量、2025年は1.8%減", "source": "EU Reporter", "url": "https://www.eureporter.co/economy/transport/2026/09/16/rail-freight-transport-dropped-by-1-8-in-2025/", "published_at": "2026-09-16", "summary_ja": ["Eurostatが9月14日に公表したデータで、2025年のEU鉄道貨物輸送量は3,682億トンキロと前年比1.8%減となった。", "減少は4年連続で、16カ国が減少・8カ国が増加、下落幅はアイルランド（-35.2%）が最大だった。", "国別ではドイツがEU全体の33.5%（1,235億トンキロ）で最大、ポーランド14.7%、フランス9.3%が続く。"], "collected_at": "2026-09-16T03:12:32-07:00"}, {"category": "container_leasing", "kind": "earnings", "title": "Touax: 2026 Half-Year Results - A temporary slowdown but several strategic milestones", "title_ja": "Touax、上期は一時的な減速も戦略目標は進展", "source" <script>
(function () {

    railcar_leasing: { label: "北米貨車リース", varName: "--cat-railcar" },
    rail_industry: { label: "北米鉄道業界", varName: "--cat-rail" },

    alt_investment: { label: "オルタナ投資", varName: "--cat-alt" },
    // legacy categories: still rendered for older articles until they age out
    other_real_assets: { label: "実物資産", varName: "--cat-assets" },
    macro_indicators: { label: "マクロ指標", varName: "--cat-macro" }
  };
  var ORDER = ["railcar_leasing", "rail_industry", "container_leasing", "eu_railcar_leasing", "alt_investment"];
  var KIND_LABEL = { earnings: "決算", personnel: "人事", regulatory: "規制当局" };

  var raw = document.getElementById("news-data").textContent;
  var articles = [];
  try { articles = JSON.parse(raw); } catch (e) { articles = []; }

  articles.sort(function (a, b) {
    var da = a.published_at || a.collected_at || "";
    var db = b.published_at || b.collected_at || "";
    return db.localeCompare(da);
  });

  var state = { category: "all", query: "" };

  var pillsEl = document.getElementById("pills");
  function makePill(key, label) {
    var btn = document.createElement("button");
    btn.className = "pill";
    btn.type = "button";
    btn.setAttribute("aria-pressed", key === state.category ? "true" : "false");
    btn.dataset.key = key;
    var dot = document.createElement("span");
    dot.className = "dot";
    if (key !== "all") dot.style.setProperty("--dot", "var(" + CATEGORY_META[key].varName + ")");
    btn.appendChild(dot);
    btn.appendChild(document.createTextNode(label));
    btn.addEventListener("click", function () {
      state.category = key;
      Array.prototype.forEach.call(pillsEl.children, function (c) {
        c.setAttribute("aria-pressed", c.dataset.key === key ? "true" : "false");
      });
      render();
    });
    return btn;
  }
  pillsEl.appendChild(makePill("all", "すべて"));
  ORDER.forEach(function (key) { pillsEl.appendChild(makePill(key, CATEGORY_META[key].label)); });

  document.getElementById("search").addEventListener("input", function (e) {
    state.query = e.target.value.trim().toLowerCase();
    render();
  });

  function fmtDate(article) {
    var d = article.published_at;
    if (!d) return "日付不明";
    return d;
  }

  function summaryPoints(article) {
    var s = article.summary_ja;
    if (!s) return [];
    return Array.isArray(s) ? s : [s];
  }

  function render() {
    var grid = document.getElementById("grid");
    grid.innerHTML = "";
    var filtered = articles.filter(function (a) {
      if (state.category !== "all" && a.category !== state.category) return false;
      if (state.query) {
        var hay = (a.title + " " + (a.title_ja || "") + " " + summaryPoints(a).join(" ") + " " + (a.source || "")).toLowerCase();
        if (hay.indexOf(state.query) === -1) return false;
      }
      return true;
    });

    document.getElementById("count-row").textContent = filtered.length + " 件表示中（全 " + articles.length + " 件）";

    if (filtered.length === 0) {
      var empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "該当する記事が見つかりませんでした。";
      grid.appendChild(empty);
      return;
    }

    filtered.forEach(function (a) {
      var meta = CATEGORY_META[a.category] || { label: a.category, varName: "--text-muted" };
      var card = document.createElement("article");
      card.className = "card";
      card.style.setProperty("--cat-color", "var(" + meta.varName + ")");

      var metaRow = document.createElement("div");
      metaRow.className = "card-meta mono";
      var tag = document.createElement("span");
      tag.className = "tag";
      tag.textContent = meta.label;
      metaRow.appendChild(tag);
      if (KIND_LABEL[a.kind]) {
        var kind = document.createElement("span");
        kind.className = "kind";
        kind.textContent = KIND_LABEL[a.kind];
        metaRow.appendChild(kind);
      }
      var sep = document.createElement("span");
      sep.textContent = "·";
      metaRow.appendChild(sep);
      var src = document.createElement("span");
      src.textContent = a.source || "";
      metaRow.appendChild(src);
      var sep2 = document.createElement("span");
      sep2.textContent = "·";
      metaRow.appendChild(sep2);
      var date = document.createElement("span");
      date.textContent = fmtDate(a);
      metaRow.appendChild(date);
      card.appendChild(metaRow);

      var h2 = document.createElement("h2");
      var link = document.createElement("a");
      link.href = a.url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = a.title_ja || a.title;
      h2.appendChild(link);
      card.appendChild(h2);

      if (a.title_ja && a.title && a.title_ja !== a.title) {
        var en = document.createElement("p");
        en.className = "title-en";
        en.textContent = a.title;
        card.appendChild(en);
      }

      var points = summaryPoints(a);
      if (points.length) {
        var ul = document.createElement("ul");
        ul.className = "summary-list";
        points.forEach(function (point) {
          var li = document.createElement("li");
          li.textContent = point;
          ul.appendChild(li);
        });
        card.appendChild(ul);
      }

      grid.appendChild(card);
    });
  }

  document.getElementById("updated-at").textContent = "最終更新: 2026-10-10 06:26 PDT";
  render();
})();
</script>
