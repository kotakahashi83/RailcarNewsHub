<style>

      --accent: #e8763f;

      --cat-railcar: #78b0d4;
      --cat-rail: #99a4ac;
      --cat-alt: #63b699;
      --cat-container: #5fc1cf;
      --cat-eu: #c39be0;
      --cat-assets: #d6a24d;
      --cat-macro: #b79bd9;
      --focus: #6bb6ef;
      --shadow: rgba(0, 0, 0, 0.4);

  :root[data-theme="dark"] {
    --bg: #14181b;
    --surface: #1d2226;
    --surface-alt: #262c30;
    --text: #e7e9ea;
    --text-muted: #9aa5ac;
    --border: #333b40;
    --accent: #e8763f;
    --accent-ink: #14181b;
    --cat-railcar: #78b0d4;
    --cat-rail: #99a4ac;
    --cat-alt: #63b699;
    --cat-container: #5fc1cf;
    --cat-eu: #c39be0;
    --cat-assets: #d6a24d;
    --cat-macro: #b79bd9;
    --focus: #6bb6ef;
    --shadow: rgba(0, 0, 0, 0.4);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "IBM Plex Sans", "Hiragino Kaku Gothic ProN", sans-serif;
    line-height: 1.55;
  }
  h1, h2, .display {
    font-family: "Big Shoulders Display", "Hiragino Sans", sans-serif;
    font-weight: 800;
    letter-spacing: 0.01em;
    text-wrap: balance;
  }
  .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
  a { color: inherit; }

  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 1.1rem clamp(1rem, 3vw, 2.5rem);
  }
  .header-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
  }
  .brand {
    display: flex;
    align-items: baseline;
    gap: 0.6rem;
  }
  .brand h1 {
    margin: 0;
    font-size: clamp(1.5rem, 2.6vw, 2.1rem);
    line-height: 1;
  }
  .brand .tagline {
    color: var(--text-muted);
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.09em;
  }
  .updated {

    color: var(--text-muted);
    text-align: right;
    white-space: nowrap;

    align-items: center;

    flex-wrap: wrap;
  }
  .pill {

    border-radius: 50%;

    margin-left: auto;
    position: relative;
  }

    background: var(--surface-alt);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 999px;
    padding: 0.4rem 0.9rem 0.4rem 2rem;
    font-size: 0.85rem;
    font-family: inherit;
    width: 15rem;
    max-width: 40vw;
  }
  .search-box::before {
    content: "";
    position: absolute;
    left: 0.75rem;
    top: 50%;
    width: 0.7rem;
    height: 0.7rem;
    border: 1.5px solid var(--text-muted);
    border-radius: 50%;
    transform: translateY(-60%);
  }
  .search-box::after {
    content: "";
    position: absolute;
    left: 1.35rem;
    top: 62%;
    width: 0.45rem;
    height: 1.5px;
    background: var(--text-muted);
    transform: rotate(45deg);
  }

  main {
    max-width: 68rem;
    margin: 0 auto;
    padding: 1.6rem clamp(1rem, 3vw, 2.5rem) 4rem;
  }
  .count-row {
    color: var(--text-muted);
    font-size: 0.82rem;
    margin: 0 0 1rem;
  }
  .grid {
    display: grid;
    gap: 0.85rem;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 4px solid var(--cat-color, var(--border));
    border-radius: 0.5rem;
    padding: 0.95rem 1.15rem;
    box-shadow: 0 1px 2px var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 0.4rem;

  .card-meta {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    font-size: 0.74rem;
    color: var(--text-muted);
    flex-wrap: wrap;
  }
  .tag {
    color: var(--cat-color);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-size: 0.7rem;
  }
  .kind {
    border: 1px solid var(--cat-color);
    color: var(--cat-color);
    border-radius: 0.25rem;
    padding: 0 0.35rem;
    font-size: 0.66rem;
    font-weight: 600;
    letter-spacing: 0.04em;
  }
  .card h2 {
    margin: 0;
    font-size: 1.15rem;
    font-weight: 700;
    font-family: "IBM Plex Sans", sans-serif;
    letter-spacing: 0;
  }
  .title-en {
    margin: 0.1rem 0 0;
    color: var(--text-muted);
    font-size: 0.82rem;
    line-height: 1.4;
  }
  .card h2 a {
    text-decoration: none;
  }
  .card h2 a:hover { text-decoration: underline; }
  .card p {
    margin: 0;
    color: var(--text);
    font-size: 0.92rem;
  }
  .summary-list {
    margin: 0;
    padding-left: 1.1rem;
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
  }
  .summary-list li {
    color: var(--text);
    font-size: 0.92rem;
  }
  .summary-list li::marker {
    color: var(--cat-color);
  }
  .empty {
    color: var(--text-muted);
    text-align: center;
    padding: 3rem 1rem;
    font-size: 0.95rem;
  }
  footer {
    max-width: 68rem;
    margin: 0 auto;
    padding: 0 clamp(1rem, 3vw, 2.5rem) 3rem;
    color: var(--text-muted);
    font-size: 0.78rem;
  }
  footer a { color: var(--focus); }

    .pill, .card { transition: background 0.12s ease, border-color 0.12s ease, box-shadow 0.12s ease; }

提出した。", "提案者はCapito環境公共事業委員長で、Whitehouse、Heinrich、Lee各議員が共同提案し、法案はエネルギー・天然資源委員会に付託された。", "審査・訴訟提起の期限明確化、環境審査の範囲の明確化、水質浄化法401条認証の制限などを盛り込み、AARは貨物鉄道の設備投資が長期停滞する現状の改善につながるとして支持を表明した。"], "collected_at": "2026-10-07T06:30:10-07:00"}, {"category": "container_leasing", "kind": "news", "title": "Container shippers focus on service delivery over cost", "title_ja": "荷主、コンテナ輸送でコストより定時性を重視", "source": "Seatrade Maritime", "url": "https://www.seatrade-maritime.com/containers/container-shippers-focus-on-service-delivery-over-cost", "published_at": "2026-10-06", "summary_ja": ["Xenetaのアナリストによると、2027年の物流計画で荷主は運賃水準よりサービス品質・定時性を優先する姿勢に転じている。", "2月末のイラン戦争開始以降、燃油サーチャージ（BAF）は2倍以上に上昇し、スポット運賃はアラビア湾向けで558%、南米東岸向けで466%、米国東岸・西岸向けで各327%・321%上昇した。", "荷主の20〜35%が運賃下落を見込んで3カ月のローリング契約を選んだが、相場が高止まりしたまま交渉力を失う結果となった。"], "collected_at": "2026-10-07T06:30:10-07:00"}, {"category": "rail_industry", "kind": "news", "title": "Silence Is Not Opposition", "title_ja": "UP、統合支持顧客は貨物量の3割超と主張", "source": "Union Pacific", "url": "https://www.up.com/announcements/customer-news/2026/CN2026-27", "published_at": "2026-10-06", "summary_ja": ["Union Pacificのマーケティング・販売担当EVPケニー・ロッカー氏が顧客向け書簡を公表し、NS統合について沈黙している顧客を反対派として数えるべきではないと主張した。", "STBに支持意見書を提出済みの顧客はUPの輸送量の30%超を占めるとし、業界団体による1件の提出を顧客数として扱う対立陣営の集計手法を批判している。", "統合案の本論に関する意見・条件付与要求の提出期限は2026年11月18日で、労組や荷主団体の反対表明が相次ぐなかでの顧客向け説得工作となる。"], "collected_at": "2026-10-07T13:30:32-07:00"}, {"category": "container_leasing", "kind": "news", "title": "Sea-Intelligence: Asian port congestion could persist into mid-2027", "title_ja": "アジア港湾混雑、2027年半ばまで長期化の恐れ", "source": "WorldCargo News", "url": "https://www.worldcargonews.com/news/2026/10/sea-intelligence-asian-port-congestion-could-persist-into-mid-2027/", "published_at": "2026-10-06", "summary_ja": ["Sea-Intelligence は、台風による滞船で積み上がったアジア主要港の混雑が2027年半ばまで解消しない可能性があると分析した。", "世界の定時到着率はコロナ禍以降初めて50%を下回り、2025年6月の水準に戻るには7〜10か月を要すると試算している。", "9月時点の同社試算は4.5〜6か月だったため回復見通しは後退し、2027年2月の春節前の需要期までに正常化しない恐れがある。"], "collected_at": "2026-10-08T06:26:06-07:00"}, {"category": "rail_industry", "kind": "news", "title": "Freight Rail Costs That Don't Appear in Freight Rates", "title_ja": "鉄道運賃に表れない荷主負担コストを Railway Age が分析", "source": "Railway Age", "url": "https://www.railwayage.com/regulatory/freight-rail-costs-that-dont-appear-in-freight-rates/", "published_at": "2026-10-06", "summary_ja": ["Railway Age の寄稿は、鉄道とトラックのコスト比較で見落とされがちな、ラインホール運賃に含まれない荷主側負担のコストを論じた。", "列車内で貨物に加わる力に耐えるための梱包・積付け費用や、紙ロールのように納入先の印刷ラインで初めて判明する貨物損傷の損失が荷主負担になる例を挙げた。", "Union Pacific の運送約款では Carmack 条項に基づく補償上限の引き上げが別建ての有料オプションであり、列車の長大化・重量化で車両への作用力が増すとする FRA の研究も引用している。"], "collected_at": "2026-10-09T06:29:11-07:00"}, {"category": "container_leasing", "kind": "news", "title": "Durban terminal delays drag on as minister calls for action to clear backlog", "title_ja": "ダーバン港の滞留長期化、南ア運輸相が回復計画を要求", "source": "WorldCargo News", "url": "https://www.worldcargonews.com/news/2026/10/durban-terminal-delays-drag-on-as-minister-calls-for-action-to-clear-backlog/", "published_at": "2026-10-06", "summary_ja": ["南アフリカの運輸相がダーバン・ゲートウェイ・ターミナル（DGT）を視察し、滞留解消に向けた詳細な回復計画の提出を求めた。", "混乱は8月15日のターミナル運営システム（Navis N4）への移行が発端で、業界関係者の指摘では移行後に週間取扱量が約26%落ち込み、荷役機材の稼働制約も残っているとされる。", "DGTは8月初旬以降ターミナル保管料をゼロに据え置き、10月1日着岸船から段階的に通常の保管条件へ戻す方針で、空コンテナの回転や機材確保への影響は当面続く見通し。"], "collected_at": "2026-10-11T13:27:01-07:00"}, {"category": "railcar_leasing", "kind": "regulatory", "title": "Railway Tank Cars and Parts Thereof From Mexico; Institution of Antidumping and Countervailing Duty Investigations and Scheduling of Preliminary Phase Investigations", "title_ja": "USITC、メキシコ製タンク車の反ダンピング調査を開始", "source": "Federal Register (USITC)", "url": "https://www.federalregister.gov/documents/2026/10/05/2026-20349/railway-tank-cars-and-parts-thereof-from-mexico-institution-of-antidumping-and-countervailing-duty", "published_at": "2026-10-05", "summary_ja": ["USITCは10月5日、メキシコ産の鉄道タンク車と部品を対象とする反ダンピング・相殺関税調査（701-TA-809、731-TA-1810）の予備段階調査を開始した。", "申立人はUTLX Manufacturingで、ダンピングマージンを12.70〜32.58%、補助金もデミニミス超と主張 uarie-reveals-99m-technomar-boxship-refinancing/", "published_at": "2026-10-04", "summary_ja": ["Macquarieは、George Youroukos氏率いるTechnomar Groupの船主会社に対し、コンテナ船7隻の再融資を含む9,900万ドルのシニアローンを供与したと明らかにした。", "対象船名・金利・満期は公表しておらず、同社のギリシャ海運向け融資残高は75件超・10億ドル以上に達する。", "Macquarieは2017年のAtlas Maritime案件以降、ギリシャ海運に20億ドル超を投じており、輸送実物資産向けプライベートクレジットの広がりを示している。"], "collected_at": "2026-10-05T06:29:57-07:00"}, {"category": "container_leasing", "kind": "news", "title": "DP World expands crane capacity at London Gateway and Southampton", "title_ja": "DP World、英2港にガントリークレーンを追加投入", "source": "Container News", "url": "https://container-news.com/dp-world-expands-crane-capacity-at-london-gateway-and-southampton/", "published_at": "2026-10-03", "summary_ja": ["DP Worldは英国のLondon GatewayとSouthamptonでコンテナ荷役能力を拡張し、上海から運ばれた新造岸壁クレーンが到着した。", "London Gateway向けの2基は重量2,000トン超・高さ約150mで、10億ポンド規模の拡張計画で建設中の全電動Berth 5（2027年稼働予定）に設置される。", "Southamptonには来週さらに2基が到着して岸壁クレーンは計16基となり、2026年に納入された4基の投資額は6,000万ポンド、40フィート2本の同時吊り上げと24,000TEU級船への対応が可能。"], "collected_at": "2026-10-03T06:27:21-07:00"}, {"category": "rail_industry", "kind": "news", "title": "BNSF hit by severe weather in Southwest and Nebraska", "title_ja": "BNSF、ネブラスカ州の洪水でヤード混乱と輸送遅延", "source": "Trains", "url": "https://www.trains.com/pro/freight/class-i/bnsf-hit-by-severe-weather-in-southwest-and-nebraska/", "published_at": "2026-10-02", "summary_ja": ["BNSF は10月1日、数時間で4〜5インチの降雨による広域の洪水でネブラスカ州リンカーン周辺の輸送に支障が出ていると顧客に通知した。", "リンカーン・ヤードの作業が乱れ、周辺道路の閉鎖も重なったことで、同社は貨物の遅延と通常より長い輸送日数を見込むとしている。", "同日午後4時半頃にはアイオワ州 Pleasantville 付近で57両編成のうち約25両が脱線し（負傷者・危険物の関与なし）、デモインは9月の降水量14.5インチで観測史上3番目の多雨となっていた。"], "collected_at": "2026-10-02T06:27:04-07:00"}, {"category": "container_leasing", "kind": "news", "title": "Piraeus container throughput falls 39% in H1 2026", "title_ja": "ピレウス港Pier I、上期の取扱量が38.7%減", "source": "WorldCargo News", "url": "https://www.worldcargonews.com/news/2026/10/piraeus-container-throughput-falls-39-in-h1-2026/", "published_at": "2026-10-02", "summary_ja":  ["線路脇モニタリング会社RailStateのデータが、CPKCとCNで運ばれるサスカチュワン産カリ肥料の行き先を路線別に示した。", "同州で採掘されるカリ肥料はほぼ全量が鉄道で州外に運ばれるため、ホッパー車の需給と輸送ルートの把握に直結する。", "トランプ大統領が9月21日にベラルーシからのカリ肥料調達交渉に言及するなど貿易摩擦で政治問題化しており、荷主や投資家の関心が高まっている。"], "collected_at": "2026-09-26T06:27:48-07:00"}, {"category": "rail_industry", "kind": "regulatory", "title": "Rail Industry Wants Full 11th Circ. To Review FRA Rule", "title_ja": "鉄道業界、2人乗務規則で第11巡回区の大法廷審理を請求", "source": "Law360", "url": "https://www.law360.com/articles/2529902/rail-industry-wants-full-11th-circ-to-review-fra-rule", "published_at": "2026-09-25", "summary_ja": ["AAR、ASLRRAと鉄道6社が、FRAの2人乗務義務規則を支持した第11巡回区控訴裁の判断について大法廷（en banc）での再審理を求めた。", "3人合議体は93ページ・2対1の判断で「鉄道側の主張にはいずれも理由がない」として訴えを退けていた。", "申立ては同判断が行政機関の権限を不当に広げ最高裁判例に反すると主張しており、乗務員規制は貨物列車の運行コストと自動化計画に影響する。"], "collected_at": "2026-09-26T06:27:48-07:00"}, {"category": "container_leasing", "kind": "news", "title": "Drewry: World Container Index Down 1% Last Week", "title_ja": "Drewry世界コンテナ指数、1%下落し4,468ドル", "source": "Hellenic Shipping News", "url": "https://www.hellenicshippingnews.com/drewry-world-container-index-down-1-last-week-11/", "published_at": "2026-09-25", "summary_ja": ["9月24日時点のDrewry世界コンテナ指数（WCI）は40フィートコンテナ当たり4,468ドルで、前週から1%下落した。", "下げはアジア→欧州航路の運賃低下が主因で、上海→ロサンゼルスは2%上昇の7,838ドル、上海→ニューヨークは10,373ドルで横ばいだった。", "船社は抜港（ブランクセーリング）で供給を調整しており、翌週は15便の抜港が告知されている。"], "collected_at": "2026-09-26T06:27:48-07:00"}, {"category": "eu_railcar_leasing", "kind": "news", "title": "FS Logistix is entering the demonstration phase of the DAC system", "title_ja": "FS Logistix、DACを実運用環境での実証段階へ", "source": "Railway PRO", "url": "https://www.railwaypro.com/wp/fs-logistix-is-entering-the-demonstration-phase-of-the-dac-system/", "published_at": "2026-09-25", "summary_ja": ["イタリアFS傘下のFS Logistixが、InnoTrans 2026でデジタル自動連結器（DAC）を試験段階から実運用環境での実証段階に移すと表明した。", "同社はMercitalia Intermodal、Mercitalia Rail、Mercitalia Shunting & Terminalを通じ、Europe's RailのTRANS4M-RとDACtiVateの両プロジェクトに参加している。", "DACは連結・解放の自動化で作業の安全性を高め列車長と積載量の拡大や作業時間・コストの削減につな : "Trains", "url": "https://www.trains.com/pro/freight/ntsb-recommends-end-to-crew-members-riding-railcars-during-shoving-moves/", "published_at": "2026-09-21", "summary_ja": ["NTSBは9月21日にシカゴで記者会見を開き、入換の推進（shoving）作業中に乗務員が貨車に乗る慣行の禁止をFRAとClass I全社に勧告した。", "2020年10月以降に調査した推進作業関連の18件の事故で、作業員14人が死亡、4人が重傷を負ったとしている。", "NTSBは「他の輸送モードでは許容されない慣行」として代替手段への切り替えを求めており、FRAの規則化や各社の入換作業手順の見直しにつながる可能性がある。"], "collected_at": "2026-09-21T20:55:37-07:00"}, {"category": "container_leasing", "kind": "news", "title": "Asia - US container rates could surpass pandemic peak", "title_ja": "アジア発米国向け運賃、コロナ期ピーク超えの可能性", "source": "Seatrade Maritime", "url": "https://www.seatrade-maritime.com/containers/asia-us-container-rates-could-surpass-pandemic-peak", "published_at": "2026-09-21", "summary_ja": ["Xenetaは、2月のホルムズ海峡での紛争開始以降、太平洋航路のスポット運賃が325%上昇したと指摘した。", "10月初にも船社による追加値上げが想定され、DrewryとXenetaはいずれも太平洋航路のさらなる上昇を予想する。", "上昇要因についてDrewryは船社の船腹調整を、Xenetaは地政学要因を、Dynamarは気象要因による混雑を挙げている。"], "collected_at": "2026-09-24T21:16:18-07:00"}, {"category": "eu_railcar_leasing", "kind": "regulatory", "title": "Germany to revise single wagonload subsidies guidelines", "title_ja": "独政府、単車輸送補助金の配分基準を実績ベースへ見直し", "source": "RailFreight.com", "url": "https://www.railfreight.com/policy/2026/09/21/germany-to-revise-single-wagonload-subsidies-guidelines/", "published_at": "2026-09-21", "summary_ja": ["ドイツ政府が単車輸送（single wagonload）向け補助金の配分基準を見直し、計画された輸送量ベースから実際に実施された輸送の実績ベースへ切り替える方針と報じられた。", "2026年の補助金枠は過年度の未執行予算を充当して8,400万ユーロ増額され総額最大3億8,400万ユーロとなるが、翌年は1億1,000万ユーロ減の2億7,400万ユーロに縮小する見込み。", "単車輸送はドイツの鉄道貨物輸送量の18%を占め化学・鉄鋼・自動車向けの基幹サービスであるため、配分基準の変更は貨車の稼働構成や貨車保有者の需要見通しに影響する。"], "collected_at": "2026-09-25T13:29:17-07:00"}, {"category": "alt_investment", "kind": "news", "title": "Ares Said to Eye Buying Stake in Danish Infrastructure Fund CIP", "title_ja": "Ares、デンマークのインフラ運用CIPへの出資を検討", "source": "Bloomberg", "url": "https://www.bloomberg.com/news/articles/2026-09-19/ares-said-to-eye-buying-stake-in-danish-infrastructure-fund-cip", ected_at": "2026-09-23T13:26:23-07:00"}, {"category": "rail_industry", "kind": "news", "title": "UP-NS Merger Would Create Seven New Premium Intermodal Lanes, Railroads Say", "title_ja": "UP・NS、合併でプレミアム・インターモーダル7路線を新設と主張", "source": "Railway Age", "url": "https://www.railwayage.com/freight/class-i/up-ns-merger-would-create-seven-new-premium-intermodal-lanes-railroads-say/", "published_at": "2026-09-18", "summary_ja": ["Union PacificのJim Vena CEOは、北米インターモーダル協会（IANA）のExpoで、NSとの合併によりプレミアム・インターモーダル7路線を新設し、既存約10,000レーンを単一鉄道サービス化できると述べた。", "両社は統合後に約100港湾とカナダ・メキシコ向け10の国際ゲートウェイにアクセスでき、年間約35億ドルのコスト効果と約210万トラック積みのモーダルシフトが見込めるとしている。", "取引完了時期は2027年第3〜第4四半期を想定しており、リードタイム短縮と定時性向上を荷主への訴求点に据えている。"], "collected_at": "2026-09-28T06:32:48-07:00"}]</script>

  var raw = document.getElementById("news-data").textContent;
  var articles = [];
  try { articles = JSON.parse(raw); } catch (e) { articles = []; }

  articles.sort(function (a, b) {
    var da = a.published_at || a.collected_at || "";
    var db = b.published_at || b.collected_at || "";
    return db.localeCompare(da);
  });

  var state = { category: "all", query: "" };

  var pillsEl = document.getElementById("pills");
  function makePill(key, label) {
    var btn = document.createElement("button");
    btn.className = "pill";
    btn.type = "button";
    btn.setAttribute("aria-pressed", key === state.category ? "true" : "false");
    btn.dataset.key = key;
    var dot = document.createElement("span");
    dot.className = "dot";
    if (key !== "all") dot.style.setProperty("--dot", "var(" + CATEGORY_META[key].varName + ")");
    btn.appendChild(dot);
    btn.appendChild(document.createTextNode(label));
    btn.addEventListener("click", function () {
      state.category = key;
      Array.prototype.forEach.call(pillsEl.children, function (c) {
        c.setAttribute("aria-pressed", c.dataset.key === key ? "true" : "false");
      });
      render();
    });
    return btn;
  }
  pillsEl.appendChild(makePill("all", "すべて"));
  ORDER.forEach(function (key) { pillsEl.appendChild(makePill(key, CATEGORY_META[key].label)); });

  document.getElementById("search").addEventListener("input", function (e) {
    state.query = e.target.value.trim().toLowerCase();
    render();
  });

  function fmtDate(article) {
    var d = article.published_at;
    if (!d) return "日付不明";
    return d;
  }

  function summaryPoints(article) {
    var s = article.summary_ja;
    if (!s) return [];
    return Array.isArray(s) ? s : [s];
  }

  function render() {
    var grid = document.getElementById("grid");
    grid.innerHTML = "";
    var filtered = articles.filter(function (a) {
      if (state.category !== "all" && a.category !== state.category) return false;
      if (state.query) {
        var hay = (a.title + " " + (a.title_ja || "") + " " + summaryPoints(a).join(" ") + " " + (a.source || "")).toLowerCase();
        if (hay.indexOf(state.query) === -1) return false;
      }
      return true;
    });

    document.getElementById("count-row").textContent = filtered.length + " 件表示中（全 " + articles.length + " 件）";

    if (filtered.length === 0) {
      var empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "該当する記事が見つかりませんでした。";
      grid.appendChild(empty);
      return;
    }

    filtered.forEach(function (a) {
      var meta = CATEGORY_META[a.category] || { label: a.category, varName: "--text-muted" };
      var card = document.createElement("article");
      card.className = "card";
      card.style.setProperty("--cat-color", "var(" + meta.varName + ")");

      var metaRow = document.createElement("div");
      metaRow.className = "card-meta mono";
      var tag = document.createElement("span");
      tag.className = "tag";
      tag.textContent = meta.label;
      metaRow.appendChild(tag);
      if (KIND_LABEL[a.kind]) {
        var kind = document.createElement("span");
        kind.className = "kind";
        kind.textContent = KIND_LABEL[a.kind];
        metaRow.appendChild(kind);
      }
      var sep = document.createElement("span");
      sep.textContent = "·";
      metaRow.appendChild(sep);
      var src = document.createElement("span");
      src.textContent = a.source || "";
      metaRow.appendChild(src);
      var sep2 = document.createElement("span");
      sep2.textContent = "·";
      metaRow.appendChild(sep2);
      var date = document.createElement("span");
      date.textContent = fmtDate(a);
      metaRow.appendChild(date);
      card.appendChild(metaRow);

      var h2 = document.createElement("h2");
      var link = document.createElement("a");
      link.href = a.url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = a.title_ja || a.title;
      h2.appendChild(link);
      card.appendChild(h2);

      if (a.title_ja && a.title && a.title_ja !== a.title) {
        var en = document.createElement("p");
        en.className = "title-en";
        en.textContent = a.title;
        card.appendChild(en);
      }

      var points = summaryPoints(a);
      if (points.length) {
        var ul = document.createElement("ul");
        ul.className = "summary-list";
        points.forEach(function (point) {
          var li = document.createElement("li");
          li.textContent = point;
          ul.appendChild(li);
        });
        card.appendChild(ul);
      }

      grid.appendChild(card);
    });
  }

  document.getElementById("updated-at").textContent = "最終更新: 2026-10-17 13:24 PDT";
  render();
})();
</script>
