  a { color: inherit; }

  header {

    color: var(--text);

  .summary-list {

    padding-left: 1.1rem;
    display: flex;
    flex-direction: column;
    gap: 0.25rem;

  .summary-list li {
    color: var(--text);
    font-size: 0.92rem;
  }

    color: var(--cat-color);

  .empty {

  footer {

ology/2026/09/29/parallel-systems-and-agility-to-bring-autonomous-wagons-to-the-gulf-and-emea/", "published_at": "2026-09-29", "summary_ja": ["米国の自律型貨車開発企業Parallel Systemsが、アブダビに本拠を置く投資会社Agilityと、GCCおよびEMEA地域などで自律鉄道貨物システムを開発・商用化・ファイナンス・配備する戦略提携契約を締結した。", "Parallelの車両はバッテリー駆動で単独または小編成での走行と自動的な編成組成が可能で、コンテナ輸送時の航続距離は1充電あたり最大500マイルとされる。", "両社はまず投入路線と採算性の検討に着手し、地域仕様への適合や試験、規制当局の承認取得を進める方針で、北米発の貨車自動化技術の海外展開例となる。"], "collected_at": "2026-09-30T13:26:59-07:00"}, {"category": "railcar_leasing", "kind": "regulatory", "title": "Hazardous Materials: Incorporation of ASME Code Section XII and the National Board Inspection Code", "title_ja": "PHMSA、タンク車等にASME Section XII 2015年版を採用", "source": "Federal Register (PHMSA)", "url": "https://www.federalregister.gov/documents/2026/09/28/2026-19741/hazardous-materials-incorporation-of-asme-code-section-xii-and-the-national-board-inspection-code", "published_at": "2026-09-28", "summary_ja": ["PHMSAは危険物規則（HMR）を改正し、ASMEボイラー・圧力容器規格Section XIIの2015年版を参照規格として取り込む最終規則を公表した。", "対象は特定仕様のカーゴタンク車両（CTMV）、極低温ポータブルタンク、マルチユニット・タンク車タンクの製造と継続使用で、National Board Inspection Code（NBIC）Parts 2・3（Supplement 6含む）の2015年版も併せて取り込む。", "PHMSAは2010年にASME Section XIIをHMRへ初めて採用しており、今回は参照版の更新でタンク製造・補修時に使える規格の選択肢を広げる内容となる。"], "collected_at": "2026-09-26T06:27:48-07:00"}, {"category": "container_leasing", "kind": "news", "title": "Delays mount as port disruption in Asia ties up 3m teu of box capacity", "title_ja": "アジア港湾混乱で世界船腹の8.5%が実質稼働不能", "source": "The Loadstar", "url": "https://theloadstar.com/delays-mount-as-port-disruption-in-asia-ties-up-3m-teu-of-box-capacity/", "published_at": "2026-09-28", "summary_ja": ["Sea-Intelligenceの分析によると、台風とアジアの港湾混乱による遅延の急増で、世界のコンテナ船腹の8.5%・約300万TEUが実質的に使えない状態になっている。", "定時運航率は8月に50%を下回り、7〜8月の2カ月で12.7ポイント低下。遅延した船の平均遅れは6.8日で、コロナ期の最悪局面に次ぐ水準となった。", "滞留している300万TEUは世界5位の船社の船隊規模に相当し、機材の回転低下による空コンテナの返却・再配置の遅れが長引く可能性がある。"], "collected_at": "2026-09-28T13:27:40-07:00"}, {"category": "container_leasing", "kind": "news", "title": "Hapag-Lloyd confir ke in Euroports Group", "title_ja": "A.P. Moller Capital、欧州港湾Europortsの過半株取得へ", "source": "A.P. Moller Capital (GlobeNewswire)", "url": "https://www.globenewswire.com/news-release/2026/09/28/3369556/0/en/a-p-moller-capital-agrees-to-acquire-a-majority-stake-in-euroports-group.html", "published_at": "2026-09-28", "summary_ja": ["A.P. Moller CapitalがEuroportsを間接保有するThaumas N.V.の53.35%を取得し、同社の過半数株主となることで合意した。", "株式譲渡契約は9月25日に締結。取得価格は2026年の連結EBITDA連動で非開示とされ、規制当局などの承認は2027年第1四半期を見込む。", "Europortsは欧州最大級のバルク・ブレークバルク港湾運営会社で、50カ所超の外航・内陸ターミナルで年間7,000万トン超を扱う。既存株主のSFPIMとPMVは残留する。"], "collected_at": "2026-09-28T13:27:40-07:00"}, {"category": "rail_industry", "kind": "news", "title": "‘Higher rates, less reliable service’: Family farmers oppose rail merger", "title_ja": "全米農業者組合、UP-NS合併の却下をSTBに要求", "source": "FreightWaves", "url": "https://www.freightwaves.com/news/higher-rates-less-reliable-service-family-farmers-oppose-rail-merger", "published_at": "2026-09-28", "summary_ja": ["全米農業者組合（NFU）が、Union PacificとNorfolk Southernの合併申請を却下するようSTBに求める声明を出した。", "NFUは全米22万人超の家族経営農家・牧場主を代表する団体で、Rob Larew会長は過去の鉄道再編により農家の選択肢が減り運賃上昇と輸送信頼性の低下を招いたと主張した。", "同団体は審査で鉄道間競争の維持と農産物出荷者・消費者・食料サプライチェーンの保護を重視すべきだとしており、荷主側の反対意見がSTB審査の論点として積み上がっている。"], "collected_at": "2026-09-29T13:28:19-07:00"}, {"category": "container_leasing", "kind": "news", "title": "Oakland sees 9.6% drop in August container volumes", "title_ja": "Oakland港、8月のコンテナ取扱量が9.6%減", "source": "WorldCargo News", "url": "https://www.worldcargonews.com/news/2026/09/oakland-sees-9-6-drop-in-august-container-volumes/", "published_at": "2026-09-28", "summary_ja": ["Oakland港の8月のコンテナ取扱量は173,818TEUで、前年同月比9.6%減となった。", "実入りは131,666TEU（9.0%減）、空コンテナは42,152TEU（11.4%減）で、寄港隻数も前年の90隻から82隻に減った。", "1〜8月累計は147万TEU（4.5%減）と西海岸のゲートウェイで荷動きが鈍く、空コンテナの回送や機材配置の負担に影響しうる。"], "collected_at": "2026-09-29T13:28:19-07:00"}, {"category": "eu_railcar_leasing", "kind": "regulatory", "title": "ROSCo twilight? Government unveils proposals for fewer trains to be leased", "title_ja" r-Bremse鉄道部門担当役員のNicolas Lange氏は述べた。"], "collected_at": "2026-09-18T06:22:12-07:00"}, {"category": "rail_industry", "kind": "news", "title": "UP-NS merger can't clear regulatory hurdles, CPKC chief executive says", "title_ja": "CPKC CEO、UP-NS合併は規制を通過できないと主張", "source": "Trains", "url": "https://www.trains.com/pro/freight/class-i/up-ns-merger-cant-clear-regulatory-hurdles-cpkc-chief-executive-says/", "published_at": "2026-09-18", "summary_ja": ["CPKCのKeith Creel CEOが投資家会議で、UP・NS合併は弊害が便益を上回るためSTBの承認は得られないとの見方を示した。", "仮に2001年の合併審査規則を満たしたとしても、850億ドル規模の取引には競争上の弊害を相殺する重い条件が付き、UP側が取引を断念する可能性が高いと述べた。", "統合後のリスクとして、統合作業に伴う輸送障害、過大な市場支配力、さらなる鉄道再編の誘発の3点を挙げた。"], "collected_at": "2026-09-18T13:18:44-07:00"}, {"category": "eu_railcar_leasing", "kind": "news", "title": "PKP Cargo files long-delayed creditor deal in restructuring push", "title_ja": "PKP Cargo、再建に向け債権者合意案を申請", "source": "RailFreight.com", "url": "https://www.railfreight.com/business/2026/09/18/pkp-cargo-files-long-delayed-creditor-deal-in-restructuring-push/", "published_at": "2026-09-18", "summary_ja": ["再建手続き中のポーランド国営貨物鉄道PKP Cargoが、度重なる延期を経てようやく債権者向けの弁済案（arrangement proposals）を提出した。", "対象債権は約29.6億ズロチ（約6.9億ユーロ）で、既存の債権カット案をおおむね維持しつつ、ポーランド政府に対する3.5億ユーロの請求で得た補償を債権者と折半する条項を新たに加えた。", "同社は破産回避のため2024年に再建手続きへ移行しており、合意の成否は保有・リース車両を含む資産再編の行方を左右する。"], "collected_at": "2026-09-18T13:18:44-07:00"}, {"category": "rail_industry", "kind": "regulatory", "title": "STB Denies Motions Seeking Summary Denial of UP-NS Merger Application", "title_ja": "STB、UP-NS合併申請の即時却下を求める申立てを棄却", "source": "Surface Transportation Board", "url": "https://www.stb.gov/news-communications/latest-news/pr-26-23/", "published_at": "2026-09-18", "summary_ja": ["STBは9月18日、Union PacificとNorfolk Southernの改訂合併申請を略式却下するよう求めた複数の申立てを退ける決定を公表した。", "申立ては8月6日にBNSF Railway、CSX Transportation、および米国化学工業協会（ACC）・AFPM・NITL・The Fertilizer Instituteなど荷主団体連合の計3件が、申請がprima facie（一応の立証）基準を満たしていないとして提出していた。", "決定は合併の是非を判断したものではなく、各当事者はopening commentsで同じ主張を改めて展開でき、審査手続きはそのまま継続する。"     var btn = document.createElement("button");
    btn.className = "pill";
    btn.type = "button";
    btn.setAttribute("aria-pressed", key === state.category ? "true" : "false");
    btn.dataset.key = key;
    var dot = document.createElement("span");
    dot.className = "dot";
    if (key !== "all") dot.style.setProperty("--dot", "var(" + CATEGORY_META[key].varName + ")");
    btn.appendChild(dot);
    btn.appendChild(document.createTextNode(label));
    btn.addEventListener("click", function () {
      state.category = key;
      Array.prototype.forEach.call(pillsEl.children, function (c) {
        c.setAttribute("aria-pressed", c.dataset.key === key ? "true" : "false");
      });
      render();
    });
    return btn;
  }
  pillsEl.appendChild(makePill("all", "すべて"));
  ORDER.forEach(function (key) { pillsEl.appendChild(makePill(key, CATEGORY_META[key].label)); });

  document.getElementById("search").addEventListener("input", function (e) {
    state.query = e.target.value.trim().toLowerCase();
    render();
  });

  function fmtDate(article) {
    var d = article.published_at;
    if (!d) return "日付不明";
    return d;
  }

  function summaryPoints(article) {
    var s = article.summary_ja;
    if (!s) return [];
    return Array.isArray(s) ? s : [s];
  }

  function render() {
    var grid = document.getElementById("grid");
    grid.innerHTML = "";
    var filtered = articles.filter(function (a) {
      if (state.category !== "all" && a.category !== state.category) return false;
      if (state.query) {
        var hay = (a.title + " " + (a.title_ja || "") + " " + summaryPoints(a).join(" ") + " " + (a.source || "")).toLowerCase();
        if (hay.indexOf(state.query) === -1) return false;
      }
      return true;
    });

    document.getElementById("count-row").textContent = filtered.length + " 件表示中（全 " + articles.length + " 件）";

    if (filtered.length === 0) {
      var empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "該当する記事が見つかりませんでした。";
      grid.appendChild(empty);
      return;
    }

    filtered.forEach(function (a) {
      var meta = CATEGORY_META[a.category] || { label: a.category, varName: "--text-muted" };
      var card = document.createElement("article");
      card.className = "card";
      card.style.setProperty("--cat-color", "var(" + meta.varName + ")");

      var metaRow = document.createElement("div");
      metaRow.className = "card-meta mono";
      var tag = document.createElement("span");
      tag.className = "tag";
      tag.textContent = meta.label;
      metaRow.appendChild(tag);
      if (KIND_LABEL[a.kind]) {
        var kind = document.createElement("span");
        kind.className = "kind";
        kind.textContent = KIND_LABEL[a.kind];
        metaRow.appendChild(kind);
      }
      var sep = document.createElement("span");
      sep.textContent = "·";
      metaRow.appendChild(sep);
      var src = document.createElement("span");
      src.textContent = a.source || "";
      metaRow.appendChild(src);
      var sep2 = document.createElement("span");
      sep2.textContent = "·";
      metaRow.appendChild(sep2);
      var date = document.createElement("span");
      date.textContent = fmtDate(a);
      metaRow.appendChild(date);
      card.appendChild(metaRow);

      var h2 = document.createElement("h2");
      var link = document.createElement("a");
      link.href = a.url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = a.title_ja || a.title;
      h2.appendChild(link);
      card.appendChild(h2);

      if (a.title_ja && a.title && a.title_ja !== a.title) {
        var en = document.createElement("p");
        en.className = "title-en";
        en.textContent = a.title;
        card.appendChild(en);
      }

      var points = summaryPoints(a);
      if (points.length) {
        var ul = document.createElement("ul");
        ul.className = "summary-list";
        points.forEach(function (point) {
          var li = document.createElement("li");
          li.textContent = point;
          ul.appendChild(li);
        });
        card.appendChild(ul);
      }

      grid.appendChild(card);
    });
  }

  document.getElementById("updated-at").textContent = "最終更新: 2026-10-03 13:30 PDT";
  render();
})();
</script>
