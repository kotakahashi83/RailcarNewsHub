uments/2026/09/01/2026-17876/charge-complaint-procedures", "published_at": "2026-09-01", "summary_ja": ["FMCが、料金申立て(Charge Complaint)は暫定手続きによらず、行政法判事または少額請求担当官を用いる従来型の申立て手続きでも提起できることを明確化する規則を公布した。", "従来型手続きで申し立てられた場合、判事らはこれを料金申立てとして扱う義務を負う。", "その場合、デマレージ・ディテンション料金の合理性については解釈規則に従い共通運送人側が立証責任を負うため、荷主・フォワーダー側の救済手段が実質的に広がる。"], "collected_at": "2026-09-15T22:01:53-07:00"}, {"category": "railcar_leasing", "kind": "regulatory", "title": "ASLRRA Backs Progress, Finalization of FRA Rulemakings", "source": "Railway Age", "url": "https://www.railwayage.com/regulatory/aslrra-backs-progress-finalization-of-fra-rulemakings/", "published_at": "2026-09-01", "summary_ja": ["米短距離鉄道協会ASLRRAが、FRAによる貨車関連2規則の最終化を支持する立場を表明。", "対象は築50年超の貨車に対する特別承認要件の撤廃と車端緩衝装置（EOCC）の規制緩和で、いずれも2026年9月30日に発効する。", "ASLRRAはAARと共同意見書を提出し、安全に寄与しない追加の試験・記録保持義務の削除を求めていた。"], "collected_at": "2026-09-16T03:12:32-07:00"}, {"category": "railcar_leasing", "title": "Greenbrier Announces CEO Succession Upon Planned Retirement of Lorie Tekorius", "source": "Greenbrier Companies", "url": "https://pressroom.gbrx.com/2026-08-31-Greenbrier-Announces-CEO-Succession-Upon-Planned-Retirement-of-Lorie-Tekorius", "published_at": "2026-08-31", "summary_ja": ["グリーンブライアーがローリー・テコリアスCEO兼社長の退任を発表", "退任は2027年1月の予定", "後任にはブライアン・コムストック氏（現エグゼクティブVP兼米州担当社長）が即座に就任"], "collected_at": "2026-09-13T14:05:00+09:00"}, {"category": "railcar_leasing", "kind": "regulatory", "title": "Repealing Special Approval Requirement for Freight Cars More Than 50 Years Old", "source": "Federal Register (FRA)", "url": "https://www.federalregister.gov/documents/2026/08/31/2026-17787/repealing-special-approval-requirement-for-freight-cars-more-than-50-years-old", "published_at": "2026-08-31", "summary_ja": ["FRAが、製造から50年を超える貨車の使用に必要だった特別承認要件を撤廃する最終規則を官報に掲載した。", "規則の発効は2026年9月30日で、同日掲載の10本を含む計57本から成るFRA初の「規制緩和スプリント」の一環。", "今後は事前の承認申請に代えてFRAへの届出で足りるため、老朽貨車の継続使用が容易になり、リース各社の車齢管理や退役計画に影響する。"], "collected_at": "2026-09-15T21:28:55-07:00"}, {"category": "railcar_leasing", "     dot.className = "dot";

    btn.addEventListener("click", function () {

  pillsEl.appendChild(makePill("all", "すべて"));
  ORDER.forEach(function (key) { pillsEl.appendChild(makePill(key, CATEGORY_META[key].label)); });

  document.getElementById("search").addEventListener("input", function (e) {
    state.query = e.target.value.trim().toLowerCase();
    render();
  });

  function fmtDate(article) {
    var d = article.published_at;
    if (!d) return "日付不明";
    return d;
  }

  function summaryPoints(article) {
    var s = article.summary_ja;
    if (!s) return [];
    return Array.isArray(s) ? s : [s];
  }

  function render() {
    var grid = document.getElementById("grid");
    grid.innerHTML = "";
    var filtered = articles.filter(function (a) {
      if (state.category !== "all" && a.category !== state.category) return false;
      if (state.query) {
        var hay = (a.title + " " + summaryPoints(a).join(" ") + " " + (a.source || "")).toLowerCase();
        if (hay.indexOf(state.query) === -1) return false;
      }
      return true;
    });

    document.getElementById("count-row").textContent = filtered.length + " 件表示中（全 " + articles.length + " 件）";

    if (filtered.length === 0) {
      var empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "該当する記事が見つかりませんでした。";
      grid.appendChild(empty);
      return;
    }

    filtered.forEach(function (a) {
      var meta = CATEGORY_META[a.category] || { label: a.category, varName: "--text-muted" };
      var card = document.createElement("article");
      card.className = "card";
      card.style.setProperty("--cat-color", "var(" + meta.varName + ")");

      var metaRow = document.createElement("div");
      metaRow.className = "card-meta mono";
      var tag = document.createElement("span");
      tag.className = "tag";
      tag.textContent = meta.label;
      metaRow.appendChild(tag);
      if (KIND_LABEL[a.kind]) {
        var kind = document.createElement("span");
        kind.className = "kind";
        kind.textContent = KIND_LABEL[a.kind];
        metaRow.appendChild(kind);
      }
      var sep = document.createElement("span");
      sep.textContent = "·";
      metaRow.appendChild(sep);
      var src = document.createElement("span");
      src.textContent = a.source || "";
      metaRow.appendChild(src);
      var sep2 = document.createElement("span");
      sep2.textContent = "·";
      metaRow.appendChild(sep2);
      var date = document.createElement("span");
      date.textContent = fmtDate(a);
      metaRow.appendChild(date);
      card.appendChild(metaRow);

      var h2 = document.createElement("h2");
      var link = document.createElement("a");
      link.href = a.url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = a.title;
      h2.appendChild(link);
      card.appendChild(h2);

      var points = summaryPoints(a);
      if (points.length) {
        var ul = document.createElement("ul");
        ul.className = "summary-list";
        points.forEach(function (point) {
          var li = document.createElement("li");
          li.textContent = point;
          ul.appendChild(li);
        });
        card.appendChild(ul);
      }

      grid.appendChild(card);
    });
  }

  document.getElementById("updated-at").textContent = "最終更新: 2026-09-16 03:14 PDT";
  render();
})();
</script>
