T06:27:12-07:00"}, {"category": "rail_industry", "kind": "regulatory", "title": "Regulators turn down requests for summary denial of UP-NS merger", "title_ja": "STB、UP-NS合併申請の即時却下を求める申立てを退ける", "source": "FreightWaves", "url": "https://www.freightwaves.com/news/regulators-turn-down-requests-for-summary-denial-of-up-ns-merger", "published_at": "2026-09-18", "summary_ja": ["米STBは9月18日、BNSF、CSXおよび荷主団体連合が8月6日に申し立てたUP-NS合併申請の即時却下（summary denial）3件をいずれも却下した。", "申立て側は申請がprima facie（一応の立証）基準を満たしておらず致命的な欠陥があると主張していた。", "STBは5ページの決定で「重要な論点を含むが、さらなる証拠と主張が判断に資する」として審理継続を選択し、本格審査が続くことになった。"], "collected_at": "2026-09-23T13:26:23-07:00"}, {"category": "rail_industry", "kind": "news", "title": "Union protests as CSX plans to cut or furlough maintenance-of-way workers", "title_ja": "CSX、保線165職の廃止と最大1,062人の一時帰休へ", "source": "Trains", "url": "https://www.trains.com/pro/maintenance-of-way/union-protests-as-csx-plans-to-cut-or-furlough-maintenance-of-way-workers/", "published_at": "2026-09-18", "summary_ja": ["保線労組BMWEDによると、CSXは保線（MOW）職165ポジションの恒久廃止と複数の保線拠点閉鎖、最大1,062人の一時帰休を進める。", "CSXは9月14日に組合へ通知し11月中旬までに実施、線路班の約900人は2月まで復帰見込みがないとされる。", "CSXは季節的な作業量に合わせたEngineering部門の調整と説明する一方、組合は保守の積み残しと安全リスクをFRA・STB・議会に訴える構えで、ある区間では従来12人が担当した本線142マイルと複数ヤードを4人で受け持つ計画という。"], "collected_at": "2026-09-23T13:26:23-07:00"}, {"category": "eu_railcar_leasing", "kind": "news", "title": "Knorr-Bremse wins Europe's 'first commercial DAC equipment order' under pioneer train programme", "title_ja": "Knorr-Bremse、欧州初のDAC商用受注をRail Cargo Groupから獲得", "source": "Railway Gazette International", "url": "https://www.railwaygazette.com/news/2026/09/18/knorr-bremse-wins-europes-first-commercial-dac-equipment-order/", "published_at": "2026-09-18", "summary_ja": ["Rail Cargo Group（RCG）がKnorr-Bremseに、欧州初の商用となるデジタル自動連結器（DAC）機器の契約を発注したと9月17日に発表された。", "対象は貨車23両と機関車1両で編成される列車で、DACに加え電子制御ユニットとセンサーを搭載し車両の機能と状態をデジタル監視する。", "この編成はEUが支援するPioDACプログラムの7本の「パイオニア列車」の1本で、2028年から通常の貨物運用に入り技術の信頼性と経済性を検証する。"], "collected_at": "2026-09-23T13:26:23-07:00"}, {"category": "container_leasing", "kind": "news", "title": "Container peak season still ongoing, port congestion hits new high", "title_ja": "コンテナ繁忙期が継続、港湾混雑は過去最高水準", "source": "Seatrade Maritime", "url": "https://www.seatrade-maritime.com/containers/container-peak-season-still-ongoing-port-congestion-hits-new-high", "published_at": "2026-09-17", "summary_ja": ["DHL Global ForwardingのOcean Freight Market Updateによると、アジア発の需要が旺盛でコンテナ市況の逼迫が続いている。", "同レポートはアジア～米州航路でピークシーズンが終わっていないこと、港湾混雑が過去最高水準に達したこと、船社がスエズ運河経由に段階的に復帰していることの3点を指摘した。", "太平洋航路のピークは今年早く到来し例年になく長引いており、年末商戦と10月上旬の中国国慶節（Golden Week）を前にした在庫積み増しが背景で、機器の回転低下はリース需要を下支えする。"], "collected_at": "2026-09-17T06:18:24-07:00"}, {"category": "alt_investment", "kind": "news", "title": "Monroe Capital Leads $60 Million Investment in 36th Street Capital", "title_ja": "Monroe Capital、設備リースの36th Streetに6,000万ドル", "source": "Business Wire", "url": "https://www.businesswire.com/news/home/20260917739964/en/Monroe-Capital-Leads-%2460-Million-Investment-in-36th-Street-Capital", "published_at": "2026-09-17", "summary_ja": ["Monroe Capitalが設備リース・ローン会社36th Street Capital（36SC）向けに6,000万ドルのClass Bタームローンを主導した。", "36SCは米国の大企業・中堅企業に仕組みリースとローンを提供し、製造・テクノロジー・ヘルスケア・建設・食品飲料に分散したポートフォリオで事業必需設備を金融しており、今回の資金は組成拡大とプラットフォーム拡張に充てられる。", "案件はMonroeで設備金融を担当するAaron Levy氏とChris Spanel氏が主導し、オルタナティブ・クレジット部門共同責任者のKyle Asher氏は36SCの仕組み力と市場地位を評価するとコメントした。"], "collected_at": "2026-09-17T06:18:24-07:00"}, {"category": "rail_industry", "kind": "news", "title": "AAR Reports Weekly Rail Traffic for the Week Ending September 12, 2026", "title_ja": "AAR週次輸送量（9月12日終了週）", "source": "Railpace", "url": "https://railpace.com/aar-reports-weekly-rail-traffic-for-the-week-ending-september-12-2026/", "published_at": "2026-09-17", "summary_ja": ["米国鉄道協会（AAR）が9月12日までの週の米国鉄道輸送量を公表し、carloadとインターモーダルの合計は494,865単位で前年同週比3.7%減となった。", "carloadは223,560台で3.3%減、インターモーダルは271,305個で4.1%減、10商品群のうち増加は穀物（+3,461台の23,507台）、石油・石油製品（+663台の10,901台）、林産品（+174台の8,342台）の3つにとどまった。", "自動車・部品（ <script>
(function () {

  var KIND_LABEL = { earnings: "決算", personnel: "人事", regulatory: "規制当局" };

  var raw = document.getElementById("news-data").textContent;
  var articles = [];
  try { articles = JSON.parse(raw); } catch (e) { articles = []; }

  articles.sort(function (a, b) {

    return db.localeCompare(da);
  });

  var state = { category: "all", query: "" };

  var pillsEl = document.getElementById("pills");
  function makePill(key, label) {
    var btn = document.createElement("button");
    btn.className = "pill";
    btn.type = "button";
    btn.setAttribute("aria-pressed", key === state.category ? "true" : "false");
    btn.dataset.key = key;
    var dot = document.createElement("span");
    dot.className = "dot";
    if (key !== "all") dot.style.setProperty("--dot", "var(" + CATEGORY_META[key].varName + ")");
    btn.appendChild(dot);
    btn.appendChild(document.createTextNode(label));
    btn.addEventListener("click", function () {
      state.category = key;
      Array.prototype.forEach.call(pillsEl.children, function (c) {
        c.setAttribute("aria-pressed", c.dataset.key === key ? "true" : "false");
      });
      render();
    });
    return btn;
  }
  pillsEl.appendChild(makePill("all", "すべて"));
  ORDER.forEach(function (key) { pillsEl.appendChild(makePill(key, CATEGORY_META[key].label)); });

  document.getElementById("search").addEventListener("input", function (e) {
    state.query = e.target.value.trim().toLowerCase();
    render();
  });

  function fmtDate(article) {
    var d = article.published_at;
    if (!d) return "日付不明";
    return d;
  }

  function summaryPoints(article) {
    var s = article.summary_ja;
    if (!s) return [];
    return Array.isArray(s) ? s : [s];
  }

  function render() {
    var grid = document.getElementById("grid");
    grid.innerHTML = "";
    var filtered = articles.filter(function (a) {
      if (state.category !== "all" && a.category !== state.category) return false;
      if (state.query) {
        var hay = (a.title + " " + (a.title_ja || "") + " " + summaryPoints(a).join(" ") + " " + (a.source || "")).toLowerCase();
        if (hay.indexOf(state.query) === -1) return false;
      }
      return true;
    });

    document.getElementById("count-row").textContent = filtered.length + " 件表示中（全 " + articles.length + " 件）";

    if (filtered.length === 0) {
      var empty = document.createElement("div");

      empty.textContent = "該当する記事が見つかりませんでした。";
      grid.appendChild(empty);
      return;
    }

    filtered.forEach(function (a) {
      var meta = CATEGORY_META[a.category] || { label: a.category, varName: "--text-muted" };
      var card = document.createElement("article");
      card.className = "card";
      card.style.setProperty("--cat-color", "var(" + meta.varName + ")");

      var metaRow = document.createElement("div");
      metaRow.className = "card-meta mono";
      var tag = document.createElement("span");
      tag.className = "tag";
      tag.textContent = meta.label;
      metaRow.appendChild(tag);
      if (KIND_LABEL[a.kind]) {

        metaRow.appendChild(kind);

      var sep = document.createElement("span");
      sep.textContent = "·";
      metaRow.appendChild(sep);
      var src = document.createElement("span");
      src.textContent = a.source || "";
      metaRow.appendChild(src);
      var sep2 = document.createElement("span");
      sep2.textContent = "·";
      metaRow.appendChild(sep2);
      var date = document.createElement("span");
      date.textContent = fmtDate(a);
      metaRow.appendChild(date);
      card.appendChild(metaRow);

      var h2 = document.createElement("h2");
      var link = document.createElement("a");
      link.href = a.url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = a.title_ja || a.title;
      h2.appendChild(link);
      card.appendChild(h2);

      if (a.title_ja && a.title && a.title_ja !== a.title) {
        var en = document.createElement("p");
        en.className = "title-en";
        en.textContent = a.title;
        card.appendChild(en);
      }

      var points = summaryPoints(a);

        ul.className = "summary-list";
        points.forEach(function (point) {
          var li = document.createElement("li");
          li.textContent = point;
          ul.appendChild(li);
        });
        card.appendChild(ul);
      }

      grid.appendChild(card);
    });
  }

  document.getElementById("updated-at").textContent = "最終更新: 2026-09-25 13:29 PDT";
  render();
})();
</script>
