<title>Railcar Wire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef0f1;
    --surface: #ffffff;
    --surface-alt: #e2e6e8;
    --text: #1b2024;
    --text-muted: #52606b;
    --border: #cbd2d6;
    --accent: #c8531a;
    --accent-ink: #ffffff;
    --cat-railcar: #2f5f7d;
    --cat-rail: #55606a;
    --cat-alt: #256b58;
    --cat-container: #1f6e7a;
    --cat-eu: #7a4a8f;
    --cat-assets: #93641f;
    --cat-macro: #6b4c93;
    --focus: #1c6fae;
    --shadow: rgba(20, 24, 27, 0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14181b;
      --surface: #1d2226;
      --surface-alt: #262c30;
      --text: #e7e9ea;
      --text-muted: #9aa5ac;
      --border: #333b40;
      --accent: #e8763f;
      --accent-ink: #14181b;
      --cat-railcar: #78b0d4;
      --cat-rail: #99a4ac;
      --cat-alt: #63b699;
      --cat-container: #5fc1cf;
      --cat-eu: #c39be0;
      --cat-assets: #d6a24d;
      --cat-macro: #b79bd9;
      --focus: #6bb6ef;
      --shadow: rgba(0, 0, 0, 0.4);
    }
  }
  :root[data-theme="dark"] {
    --bg: #14181b;
    --surface: #1d2226;
    --surface-alt: #262c30;
    --text: #e7e9ea;
    --text-muted: #9aa5ac;
    --border: #333b40;
    --accent: #e8763f;
    --accent-ink: #14181b;
    --cat-railcar: #78b0d4;
    --cat-rail: #99a4ac;
    --cat-alt: #63b699;
    --cat-container: #5fc1cf;
    --cat-eu: #c39be0;
    --cat-assets: #d6a24d;
    --cat-macro: #b79bd9;
    --focus: #6bb6ef;
    --shadow: rgba(0, 0, 0, 0.4);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "IBM Plex Sans", "Hiragino Kaku Gothic ProN", sans-serif;
    line-height: 1.55;
  }
  h1, h2, .display {
    font-family: "Big Shoulders Display", "Hiragino Sans", sans-serif;
    font-weight: 800;
    letter-spacing: 0.01em;
    text-wrap: balance;
  }
  .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
  a { color: inherit; }

  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 1.1rem clamp(1rem, 3vw, 2.5rem);
  }
  .header-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
  }
  .brand {
    display: flex;
    align-items: baseline;
    gap: 0.6rem;
  }
  .brand h1 {
    margin: 0;
    font-size: clamp(1.5rem, 2.6vw, 2.1rem);
    line-height: 1;
  }
  .brand .tagline {
    color: var(--text-muted);
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.09em;
  }
  .updated {
    font-size: 0.78rem;
    color: var(--text-muted);
    text-align: right;
    white-space: nowrap;
  }
  .controls {
    display: flex;
    gap: 0.7rem;
    align-items: center;
    margin-top: 0.9rem;
    flex-wrap: wrap;
  }
  .pills {
    display: flex;
    gap: 0.45rem;
    flex-wrap: wrap;
  }
  .pill {
    border: 1px solid var(--border);
    background: var(--surface-alt);
    color: var(--text);
    border-radius: 999px;
    padding: 0.35rem 0.85rem;
    font-size: 0.82rem;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 0.4rem;
    transition: background 0.12s ease, color 0.12s ease, border-color 0.12s ease;
  }
  .pill .dot {
    width: 0.5rem;
    height: 0.5rem;
    border-radius: 50%;
    background: var(--dot, var(--text-muted));
  }
  .pill[aria-pressed="true"] {
    background: var(--accent);
    color: var(--accent-ink);
    border-color: var(--accent);
  }
  .pill[aria-pressed="true"] .dot { background: var(--accent-ink); }
  .pill:focus-visible, .search-box input:focus-visible, .refresh-note a:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }
  .search-box {
    margin-left: auto;
    position: relative;
  }
  .search-box input {
    background: var(--surface-alt);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 999px;
    padding: 0.4rem 0.9rem 0.4rem 2rem;
    font-size: 0.85rem;
    font-family: inherit;
    width: 15rem;
    max-width: 40vw;
  }
  .search-box::before {
    content: "";
    position: absolute;
    left: 0.75rem;
    top: 50%;
    width: 0.7rem;
    height: 0.7rem;
    border: 1.5px solid var(--text-muted);
    border-radius: 50%;
    transform: translateY(-60%);
  }
  .search-box::after {
    content: "";
    position: absolute;
    left: 1.35rem;
    top: 62%;
    width: 0.45rem;
    height: 1.5px;
    background: var(--text-muted);
    transform: rotate(45deg);
  }

  main {
    max-width: 68rem;
    margin: 0 auto;
    padding: 1.6rem clamp(1rem, 3vw, 2.5rem) 4rem;
  }
  .count-row {
    color: var(--text-muted);
    font-size: 0.82rem;
    margin: 0 0 1rem;
  }
  .grid {
    display: grid;
    gap: 0.85rem;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 4px solid var(--cat-color, var(--border));
    border-radius: 0.5rem;
    padding: 0.95rem 1.15rem;
    box-shadow: 0 1px 2px var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
  }
  .card-meta {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    font-size: 0.74rem;
    color: var(--text-muted);
    flex-wrap: wrap;
  }
  .tag {
    color: var(--cat-color);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-size: 0.7rem;
  }
  .kind {
    border: 1px solid var(--cat-color);
    color: var(--cat-color);
    border-radius: 0.25rem;
    padding: 0 0.35rem;
    font-size: 0.66rem;
    font-weight: 600;
    letter-spacing: 0.04em;
  }
  .card h2 {
    margin: 0;
    font-size: 1.15rem;
    font-weight: 700;
    font-family: "IBM Plex Sans", sans-serif;
    letter-spacing: 0;
  }
  .card h2 a {
    text-decoration: none;
  }
  .card h2 a:hover { text-decoration: underline; }
  .card p {
    margin: 0;
    color: var(--text);
    font-size: 0.92rem;
  }
  .summary-list {
    margin: 0;
    padding-left: 1.1rem;
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
  }
  .summary-list li {
    color: var(--text);
    font-size: 0.92rem;
  }
  .summary-list li::marker {
    color: var(--cat-color);
  }
  .empty {
    color: var(--text-muted);
    text-align: center;
    padding: 3rem 1rem;
    font-size: 0.95rem;
  }
  footer {
    max-width: 68rem;
    margin: 0 auto;
    padding: 0 clamp(1rem, 3vw, 2.5rem) 3rem;
    color: var(--text-muted);
    font-size: 0.78rem;
  }
  footer a { color: var(--focus); }

  @media (prefers-reduced-motion: no-preference) {
    .pill, .card { transition: background 0.12s ease, border-color 0.12s ease, box-shadow 0.12s ease; }
  }
</style>

<header>
  <div class="header-top">
    <div class="brand">
      <h1>Railcar Wire</h1>
      <span class="tagline">Railcar &amp; Container Leasing Intelligence</span>
    </div>
    <div class="updated mono" id="updated-at">最終更新: --</div>
  </div>
  <div class="controls">
    <div class="pills" id="pills"></div>
    <div class="search-box">
      <input id="search" type="search" placeholder="キーワードで絞り込み" aria-label="記事を検索">
    </div>
  </div>
</header>

<main>
  <p class="count-row" id="count-row"></p>
  <div class="grid" id="grid"></div>
</main>

<footer>
  収集対象: 北米貨車リース / 北米鉄道業界 / 海上コンテナリース / 欧州貨車リース / オルタナ投資（貨車・コンテナリースは各社の決算発表・人事・規制当局のリリースを含む）。英語ソースを毎日2回（06:00 / 13:00 米国太平洋時間）自動巡回し、日本語の要点3点を付与しています。見出しをクリックすると原文記事が開きます。
</footer>

<script id="news-data" type="application/json">__RAILCAR_NEWS_JSON__</script>
<script>
(function () {
  var CATEGORY_META = {
    railcar_leasing: { label: "北米貨車リース", varName: "--cat-railcar" },
    rail_industry: { label: "北米鉄道業界", varName: "--cat-rail" },
    container_leasing: { label: "海上コンテナリース", varName: "--cat-container" },
    eu_railcar_leasing: { label: "欧州貨車リース", varName: "--cat-eu" },
    alt_investment: { label: "オルタナ投資", varName: "--cat-alt" },
    // legacy categories: still rendered for older articles until they age out
    other_real_assets: { label: "実物資産", varName: "--cat-assets" },
    macro_indicators: { label: "マクロ指標", varName: "--cat-macro" }
  };
  var ORDER = ["railcar_leasing", "rail_industry", "container_leasing", "eu_railcar_leasing", "alt_investment"];
  var KIND_LABEL = { earnings: "決算", personnel: "人事", regulatory: "規制当局" };

  var raw = document.getElementById("news-data").textContent;
  var articles = [];
  try { articles = JSON.parse(raw); } catch (e) { articles = []; }

  articles.sort(function (a, b) {
    var da = a.published_at || a.collected_at || "";
    var db = b.published_at || b.collected_at || "";
    return db.localeCompare(da);
  });

  var state = { category: "all", query: "" };

  var pillsEl = document.getElementById("pills");
  function makePill(key, label) {
    var btn = document.createElement("button");
    btn.className = "pill";
    btn.type = "button";
    btn.setAttribute("aria-pressed", key === state.category ? "true" : "false");
    btn.dataset.key = key;
    var dot = document.createElement("span");
    dot.className = "dot";
    if (key !== "all") dot.style.setProperty("--dot", "var(" + CATEGORY_META[key].varName + ")");
    btn.appendChild(dot);
    btn.appendChild(document.createTextNode(label));
    btn.addEventListener("click", function () {
      state.category = key;
      Array.prototype.forEach.call(pillsEl.children, function (c) {
        c.setAttribute("aria-pressed", c.dataset.key === key ? "true" : "false");
      });
      render();
    });
    return btn;
  }
  pillsEl.appendChild(makePill("all", "すべて"));
  ORDER.forEach(function (key) { pillsEl.appendChild(makePill(key, CATEGORY_META[key].label)); });

  document.getElementById("search").addEventListener("input", function (e) {
    state.query = e.target.value.trim().toLowerCase();
    render();
  });

  function fmtDate(article) {
    var d = article.published_at;
    if (!d) return "日付不明";
    return d;
  }

  function summaryPoints(article) {
    var s = article.summary_ja;
    if (!s) return [];
    return Array.isArray(s) ? s : [s];
  }

  function render() {
    var grid = document.getElementById("grid");
    grid.innerHTML = "";
    var filtered = articles.filter(function (a) {
      if (state.category !== "all" && a.category !== state.category) return false;
      if (state.query) {
        var hay = (a.title + " " + summaryPoints(a).join(" ") + " " + (a.source || "")).toLowerCase();
        if (hay.indexOf(state.query) === -1) return false;
      }
      return true;
    });

    document.getElementById("count-row").textContent = filtered.length + " 件表示中（全 " + articles.length + " 件）";

    if (filtered.length === 0) {
      var empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "該当する記事が見つかりませんでした。";
      grid.appendChild(empty);
      return;
    }

    filtered.forEach(function (a) {
      var meta = CATEGORY_META[a.category] || { label: a.category, varName: "--text-muted" };
      var card = document.createElement("article");
      card.className = "card";
      card.style.setProperty("--cat-color", "var(" + meta.varName + ")");

      var metaRow = document.createElement("div");
      metaRow.className = "card-meta mono";
      var tag = document.createElement("span");
      tag.className = "tag";
      tag.textContent = meta.label;
      metaRow.appendChild(tag);
      if (KIND_LABEL[a.kind]) {
        var kind = document.createElement("span");
        kind.className = "kind";
        kind.textContent = KIND_LABEL[a.kind];
        metaRow.appendChild(kind);
      }
      var sep = document.createElement("span");
      sep.textContent = "·";
      metaRow.appendChild(sep);
      var src = document.createElement("span");
      src.textContent = a.source || "";
      metaRow.appendChild(src);
      var sep2 = document.createElement("span");
      sep2.textContent = "·";
      metaRow.appendChild(sep2);
      var date = document.createElement("span");
      date.textContent = fmtDate(a);
      metaRow.appendChild(date);
      card.appendChild(metaRow);

      var h2 = document.createElement("h2");
      var link = document.createElement("a");
      link.href = a.url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = a.title;
      h2.appendChild(link);
      card.appendChild(h2);

      var points = summaryPoints(a);
      if (points.length) {
        var ul = document.createElement("ul");
        ul.className = "summary-list";
        points.forEach(function (point) {
          var li = document.createElement("li");
          li.textContent = point;
          ul.appendChild(li);
        });
        card.appendChild(ul);
      }

      grid.appendChild(card);
    });
  }

  document.getElementById("updated-at").textContent = "最終更新: __RAILCAR_LAST_UPDATED__";
  render();
})();
</script>
