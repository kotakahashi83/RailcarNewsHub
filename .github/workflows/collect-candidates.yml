name: Collect candidates

# Free, deterministic discovery layer: pulls dated articles from trade-press RSS,
# Google News RSS searches, SEC EDGAR 8-K exhibits and the Federal Register API,
# fetches plain-text excerpts, and commits data/candidates.json. The Claude
# cloud routine then only has to select, summarise and publish.

on:
  schedule:
    # ~45 min before the routine slots (10/11/17/18 UTC), plus overnight.
    - cron: "15 3,9,16,21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-candidates
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect candidates
        run: python scripts/collect_candidates.py

      - name: Commit candidates
        run: |
          git config user.name "railcar-wire-bot"
          git config user.email "railcar-wire-bot@users.noreply.github.com"
          git add data/candidates.json data/gnews_cache.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "candidates $(date -u '+%Y-%m-%dT%H:%MZ')"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
